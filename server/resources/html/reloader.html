<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reloading...</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background: #f3f4f6;
            color: #374151;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #d1d5db;
            border-top-color: #6366f1;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 1rem;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        p { margin: 0.25rem 0; font-size: 0.95rem; }
        #status { color: #6b7280; font-size: 0.85rem; margin-top: 0.5rem; }
    </style>
</head>
<body>
    <div class="spinner"></div>
    <p>Server is restarting, please wait…</p>
    <p id="status">Waiting before first check…</p>

    <script>
        const params = new URLSearchParams(window.location.search);
        const delay      = parseInt(params.get('delay')       || '2000', 10);
        const timeout    = parseInt(params.get('timeout')     || '60000', 10);
        const redirectTo = params.get('redirect_to') || '/';

        const statusEl  = document.getElementById('status');
        const startedAt = Date.now();

        function ping() {
            if (Date.now() - startedAt >= timeout) {
                statusEl.textContent = 'Timed out waiting for server.';
                return;
            }

            fetch('/', { method: 'HEAD', cache: 'no-store' })
                .then(res => {
                    if (res.ok || res.status < 500) {
                        statusEl.textContent = 'Server is back! Redirecting…';
                        window.location.href = redirectTo;
                    } else {
                        retry();
                    }
                })
                .catch(() => retry());
        }

        function retry() {
            const elapsed = Math.round((Date.now() - startedAt) / 1000);
            statusEl.textContent = `Still waiting… (${elapsed}s elapsed)`;
            setTimeout(ping, delay);
        }

        setTimeout(ping, delay);
    </script>
</body>
</html>
