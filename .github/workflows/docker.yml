name: docker
description: Build and push Docker image to Docker Hub

on:
    workflow_dispatch:
        inputs:
            tag:
                description: "Image tag (e.g. 1.0.0)"
                required: true
                type: string
    push:
        tags:
            - "v*.*.*"

jobs:
    build-and-push:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Log in to Docker Hub
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - id: get-tag
              name: get-tag
              run: |
                  if [[ -n "${{ github.event.inputs.tag }}" ]]; then
                      echo "Using input tag: ${{ github.event.inputs.tag }}"
                      echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_ENV
                  else
                      # Extract the version from the git tag (e.g., v1.0.0 -> 1.0.0)
                      GIT_TAG="${GITHUB_REF#refs/tags/}"
                      VERSION="${GIT_TAG#v}"
                      echo "Using git tag: $VERSION"
                      echo "tag=$VERSION" >> $GITHUB_ENV
                  fi

            - name: Build and push
              uses: docker/build-push-action@v6
              with:
                  context: .
                  push: true
                  tags: |
                      sidekickcoder/zenith:${{ env.tag }}
                      sidekickcoder/zenith:latest
