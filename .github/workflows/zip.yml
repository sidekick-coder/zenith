name: Build Server Packages

on:
    release:
        types: [published]
    workflow_dispatch:

permissions:
    contents: write

jobs:
    build:
        strategy:
            matrix:
                include:
                    - os: ubuntu-latest
                      platform: linux-x64
                    - os: windows-latest
                      platform: windows-x64

        runs-on: ${{ matrix.os }}

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Build
              run: npm run build

            - name: Keep production dependencies
              run: npm prune --omit=dev

            - name: Create ZIP (Linux)
              if: runner.os == 'Linux'
              run: zip -r zenith-${{ matrix.platform }}.zip dist node_modules package.json

            - name: Create ZIP (Windows)
              if: runner.os == 'Windows'
              shell: pwsh
              run: Compress-Archive -Path dist,node_modules,package.json -DestinationPath zenith-${{ matrix.platform }}.zip

            - name: Upload release asset
              if: github.event_name == 'release'
              uses: softprops/action-gh-release@v2
              with:
                  files: zenith-${{ matrix.platform }}.zip

            - name: Upload workflow artifact
              if: github.event_name == 'workflow_dispatch'
              uses: actions/upload-artifact@v4
              with:
                  name: zenith-${{ matrix.platform }}
                  path: zenith-${{ matrix.platform }}.zip
