name: build-zip

on:
    release:
        types: [published]
    workflow_dispatch:
        inputs:
            tag:
                description: "Release tag to build and upload (e.g. v1.0.0)"
                required: true
                type: string

permissions:
    contents: write

jobs:
    build:
        strategy:
            matrix:
                include:
                    - os: ubuntu-latest
                      platform: linux-x64
                    - os: windows-latest
                      platform: windows-x64

        runs-on: ${{ matrix.os }}

        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  ref: ${{ github.event.release.tag_name || inputs.tag }}

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Build
              run: npm run build

            - name: Keep production dependencies
              run: npm prune --omit=dev

            - name: Create ZIP (Linux)
              if: runner.os == 'Linux'
              run: zip -r zenith-${{ matrix.platform }}.zip zenith.js loader.js dist node_modules package.json

            - name: Create ZIP (Windows)
              if: runner.os == 'Windows'
              shell: pwsh
              run: Compress-Archive -Path zenith.js,loader.js,dist,node_modules,package.json -DestinationPath zenith-${{ matrix.platform }}.zip

            - name: Upload release asset
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: ${{ github.event.release.tag_name || inputs.tag }}
                  files: zenith-${{ matrix.platform }}.zip
